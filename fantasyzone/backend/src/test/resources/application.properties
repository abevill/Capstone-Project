spring.datasource.url=jdbc:h2:mem:fantasyzone;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username={username}
spring.datasource.password= {password}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
sports.api.base-url=http://localhost:9/unused
app.seed-sample-players=true
sync.enabled=true
jwt.secret=test-secret-test-secret-test-secret-test-1234
jwt.expiration-ms=3600000
cors.allowed-origins=http://localhost:5173
app.admin-password=TestAdmin123!
security.rate-limit.max-requests=1000
