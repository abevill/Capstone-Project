spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fantasyzone}
spring.datasource.username=username
spring.datasource.password={my password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Real NFL data: ESPN public endpoints (unofficial, no API key)
sports.api.base-url=https://site.api.espn.com/apis/site/v2/sports/football/nfl
sports.api.timeout-ms=15000
# false on a real database so the made-up sample players are not created
app.seed-sample-players=${SEED_SAMPLE_PLAYERS:true}
# optional automatic sync (daily rosters, stats every 6 hours)
sync.enabled=${SYNC_ENABLED:false}
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-123456}
jwt.expiration-ms=86400000
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin-password=${ADMIN_PASSWORD:ChangeMe123!}

security.rate-limit.max-requests=10

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# AI fantasy assistant (LLM). The key is read from the LLM_API_KEY environment variable and never stored in code.
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:claude-haiku-4-5-20251001}
llm.base-url=https://api.anthropic.com
llm.max-tokens=700
llm.timeout-ms=60000
llm.rate-limit-per-hour=${LLM_RATE_LIMIT_PER_HOUR:20}
